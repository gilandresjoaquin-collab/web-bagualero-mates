<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Bagualero Mates</title>
    <link rel="icon" href="../img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap">
    <link rel="stylesheet" href="../css/estilos.css?v=3">
</head>
<body data-pagina="login">
    <header id="encabezado"></header>

    <main id="contenido" class="acceso">
        <div class="contenedor">
            <!-- Iniciar sesión (HU-08) -->
            <section class="tarjeta-formulario acceso__caja" aria-labelledby="titulo-login">
                <h1 id="titulo-login">Iniciar sesión</h1>
                <p class="tarjeta-formulario__intro">Ingresá para ver tu carrito y tus pedidos.</p>

                <form id="form-login" novalidate>
                    <div class="alerta alerta--error" role="alert" hidden></div>

                    <div class="campo">
                        <label for="login-email">Correo electrónico</label>
                        <input id="login-email" name="email" type="email" autocomplete="email"
                               placeholder="juan@correo.com" maxlength="120" required>
                    </div>

                    <div class="campo">
                        <label for="login-password">Contraseña</label>
                        <input id="login-password" name="password" type="password"
                               autocomplete="current-password" required>
                    </div>

                    <button class="boton boton--oscuro boton--bloque" type="submit">Ingresar</button>
                </form>

                <p class="tarjeta-formulario__pie">
                    ¿No tenés cuenta? <a id="enlace-registro" href="registro.html">Creá una</a>
                </p>
            </section>
        </div>
    </main>

    <footer id="pie"></footer>

    <script src="../js/api.js?v=3"></script>
    <script src="../js/comun.js?v=3"></script>
    <script src="../js/formularios.js?v=3"></script>
    <script src="../js/login.js?v=3"></script>
</body>
</html>
