<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Bombilla de alpaca con boquilla curva, adorno y filtro -->
  <ellipse cx="108" cy="186" rx="46" ry="6" fill="#3B2A1B" opacity=".12"/>
  <!-- caño -->
  <path d="M70 26q-4 14 6 24l46 90" stroke="#A79F90" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M70 26q-4 14 6 24l46 90" stroke="#DCD5C7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- boquilla -->
  <rect x="61" y="15" width="18" height="12" rx="5" transform="rotate(-12 70 21)" fill="#B89A5B"/>
  <!-- adorno -->
  <rect x="87" y="77" width="18" height="11" rx="3" transform="rotate(63 96 82)" fill="#B89A5B"/>
  <path d="M90 80l12 5" stroke="#fff" stroke-width="1.5" opacity=".35"/>
  <!-- filtro -->
  <g transform="rotate(-27 128 156)">
    <ellipse cx="128" cy="156" rx="18" ry="27" fill="#A79F90"/>
    <ellipse cx="128" cy="156" rx="14" ry="22" fill="#DCD5C7"/>
    <g fill="#8C8475">
      <circle cx="124" cy="142" r="1.8"/><circle cx="132" cy="142" r="1.8"/>
      <circle cx="120" cy="150" r="1.8"/><circle cx="128" cy="150" r="1.8"/><circle cx="136" cy="150" r="1.8"/>
      <circle cx="120" cy="158" r="1.8"/><circle cx="128" cy="158" r="1.8"/><circle cx="136" cy="158" r="1.8"/>
      <circle cx="120" cy="166" r="1.8"/><circle cx="128" cy="166" r="1.8"/><circle cx="136" cy="166" r="1.8"/>
      <circle cx="124" cy="173" r="1.8"/><circle cx="132" cy="173" r="1.8"/>
    </g>
  </g>
</svg>
