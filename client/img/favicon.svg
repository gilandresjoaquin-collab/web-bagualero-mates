<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Favicon de Bagualero Mates: la silueta del mate con la bombilla, en crema sobre un cuadrado marrón -->
  <rect width="100" height="100" rx="22" fill="#3B2A1B"/>
  <g fill="#F0E7D6">
    <!-- Virola (el borde del mate) -->
    <rect x="30" y="30" width="40" height="8" rx="4"/>
    <!-- Cuerpo de calabaza -->
    <path d="M36 40 C26 45 18 55 18 67 C18 82 29 92 42 92 L58 92 C71 92 82 82 82 67 C82 55 74 45 64 40 Z"/>
  </g>
  <!-- Bombilla: primero un trazo marrón más ancho, así queda separada de la virola -->
  <path d="M52 34 L73 9" stroke="#3B2A1B" stroke-width="13" stroke-linecap="round"/>
  <path d="M52 34 L73 9" stroke="#F0E7D6" stroke-width="7.5" stroke-linecap="round"/>
</svg>
